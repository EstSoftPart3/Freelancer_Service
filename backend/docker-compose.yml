version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: freelancer-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancer-backend
    restart: always
    ports:
      - "8080:8080" # application.yml의 server.port: 8080
    depends_on:
      - redis
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      
      # 구글 OAuth2 환경변수 (필요시 값 설정 또는 .env 사용)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    volumes:
      - upload_data:/app/uploads

volumes:
  redis_data:
  upload_data: