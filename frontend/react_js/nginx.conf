server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 게시글 첨부 20MB(spring.servlet.multipart.max-request-size)보다 넉넉히.
    # 기본값 1m 이면 업로드가 nginx 단에서 413 으로 잘린다.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 백엔드 프록시 — BO 를 백엔드와 같은 오리진으로 만들어 CORS 를 아예 없앤다.
    # 백엔드 context-path 가 /api 이므로 경로를 그대로 넘긴다(proxy_pass 에 경로를 붙이지 말 것).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite 산출물은 파일명에 해시가 붙는다 — 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅(TanStack Router) — 새로고침·딥링크가 404 가 되지 않게 index.html 로 폴백.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
