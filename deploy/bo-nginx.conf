server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite 산출물은 파일명에 해시가 붙는다 — 영구 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 라우팅(TanStack Router) — 새로고침·딥링크가 404 가 되지 않게 index.html 로 폴백.
    # 🔴 BO 는 API 를 절대 URL(https://job.estsw.co.kr/api)로 부르므로 /api 프록시가 없다.
    #    이 폴백이 /api 까지 삼키면 안 되지만, 애초에 이 서버로 /api 요청이 오지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
