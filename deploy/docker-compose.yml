# Freelancer_Service 자동 배포. Ctrl_F 의 8081~8083 과 겹치지 않게 8092(Vue)·8093(React)만 연다.
# 비밀값은 deploy/.env 에만 둔다(.env.example 참고, 커밋 금지).
name: freelancer-service

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: fs-api
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SERVER_SERVLET_CONTEXTPATH: /api
      SERVER_TOMCAT_MAXHTTPFORMPOSTSIZE: 10MB
      # main 의 게시판 코드(1401~1403)에 맞는 데이터를 복사한 전용 DB
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/freelancer_service?useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.mariadb.jdbc.Driver
      # DB 구조를 앱이 바꾸지 못하게 고정한다
      SPRING_JPA_HIBERNATE_DDLAUTO: none
      SPRING_JPA_GENERATEDDL: "false"
      SPRING_DATA_REDIS_HOST: fs-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_SERVLET_MULTIPART_MAXFILESIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE: 10MB
      MYBATIS_MAPPERLOCATIONS: classpath:mapper/**/*.xml
      MYBATIS_CONFIGURATION_MAPUNDERSCORETOCAMELCASE: "true"
      JWT_ACCESSTOKENEXPIRATION: 1800000
      JWT_REFRESHTOKENEXPIRATION: 1209600000
      CLOUD_AWS_REGION_STATIC: ap-northeast-2
      CLOUD_AWS_STACK_AUTO: "false"
      FILE_UPLOADDIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on: [redis]
    networks: [estsoft, private]

  # Ctrl_F 의 redis 와 나눈다. private 망에만 있어 다른 컨테이너에서 접근할 수 없다.
  redis:
    image: redis:7-alpine
    container_name: fs-redis
    restart: unless-stopped
    mem_limit: 128m
    networks: [private]

  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
      args:
        APP: vue_js
    container_name: fs-web
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8092:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [estsoft]

  admin:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
      args:
        APP: react_js
    container_name: fs-admin
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8093:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [estsoft]

volumes:
  uploads:

networks:
  private:
  estsoft:
    external: true
