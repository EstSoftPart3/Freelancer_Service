# 실서버(CasaOS) 배포 구성 — 2026-08-04 서버 실측 반영.
#
# ## 설계 원칙: 기존 포트를 그대로 물려받는다
#
# 기존 컨테이너(freelancer-api-server·web-server·admin-server)를 **정지**시키고
# 같은 포트로 새 컨테이너를 올린다. 그러면 NPM·Cloudflare 설정을 **한 줄도 바꾸지 않는다.**
#
#   8081  백엔드          (기존 api-server    → freelancer-api)
#   8082  FO             (기존 web-server/Vue → freelancer-next)
#   8083  BO             (기존 admin-server   → freelancer-bo)
#
#   - 기존 컨테이너는 **정지만 하고 지우지 않는다** → 롤백 = 새것 정지 + 기존것 start
#   - sudo 가 전혀 필요 없다 (배포 파일은 ~/freelancer 아래, estsoft 소유)
#   - 업로드 디렉터리만 기존 것을 공유한다(estsoft 소유라 쓰기 가능)
#
# ⚠️ 포트가 같아 신·구를 동시에 띄울 수 없다. 따라서 **FO 이미지를 먼저 빌드해두고**
#    (빌드에는 포트가 필요 없다) 그다음 정지→기동을 한 번에 해야 중단 시간이 짧다.
#
# ## 네트워크
#   `estsoft` — redis·mariadb·NPM 이 전부 여기 있다. 컨테이너명으로 통신한다.
#
# 사용:
#   cd ~/freelancer/deploy
#   docker compose build frontend-next                      # ① 먼저 빌드(기존 서비스 유지)
#   docker stop freelancer-api-server freelancer-web-server freelancer-admin-server
#   docker compose up -d                                    # ② 교체
#
# 롤백:
#   docker compose down
#   docker start freelancer-api-server freelancer-web-server freelancer-admin-server
name: freelancer-next

services:
  # ---------------------------------------------------------------- 백엔드
  # 기존과 같은 방식(베이스 이미지 + jar 볼륨). 이미지를 굽지 않아 배포가 빠르고
  # 롤백도 jar 교체로 끝난다. 차이는 환경변수로 prod 설정을 주입한다는 것뿐.
  backend:
    image: eclipse-temurin:21-jdk
    container_name: freelancer-api
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70.0", "-jar", "backend-0.0.1-SNAPSHOT.jar"]
    environment:
      # 🔴 없으면 SecurityConfigDev/Prod 둘 다 @Profile 로 비활성이라
      #    Spring Security 기본 설정(전 경로 basic auth)이 걸린다.
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${BACKEND_PORT:-8081}
      TZ: Asia/Seoul
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      BUSINESS_VERIFY_API_KEY: ${BUSINESS_VERIFY_API_KEY}
      FILE_ENCRYPT_KEY: ${FILE_ENCRYPT_KEY}
      FILE_UPLOAD_DIR: /app/uploads
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET}
      ADMIN_MASTER_PASSWORD: ${ADMIN_MASTER_PASSWORD}
      VOC_NOTIFY_EMAIL: ${VOC_NOTIFY_EMAIL:-}
      BO_BASE_URL: ${BO_PUBLIC_URL:-https://admin-job.estsw.co.kr}
    volumes:
      - ../backend:/app
      # 🔴 기존 업로드 디렉터리를 공유한다. 다른 경로를 주면 기존 첨부가 전부 깨진다.
      - ${UPLOAD_DIR:-/DATA/freelancer_project/uploads}:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-8081}:${BACKEND_PORT:-8081}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${BACKEND_PORT:-8081}/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks: [estsoft]

  # ---------------------------------------------------------------- FO (Next.js SSR)
  # Vue 와 달리 정적 파일이 아니라 Node 프로세스가 필요해 이것만 이미지를 굽는다.
  frontend-next:
    build:
      context: ../frontend/nextjs
      dockerfile: Dockerfile
      # 🔴 빌드 컨테이너를 서비스 네트워크에 붙인다.
      #    sitemap.xml·rss.xml 은 `revalidate` 가 걸린 **정적 프리렌더**라 빌드 시점에
      #    백엔드를 호출한다. 네트워크가 없으면 조용히 빈 sitemap 이 이미지에 구워진다
      #    (1시간 뒤 재검증으로 자연 복구되긴 하지만 첫 배포가 빈 채로 나간다).
      #    → 이 때문에 **백엔드를 먼저 띄운 뒤 FO 를 빌드**해야 한다.
      network: estsoft
      args:
        # 🔴 전부 빌드 타임에 이미지로 구워진다. 바꾸려면 --build 로 다시 말아야 한다.
        API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://freelancer-api:8081/api}
        NEXT_PUBLIC_SITE_URL: ${FO_PUBLIC_URL:-https://job.estsw.co.kr}
        NEXT_PUBLIC_NAVER_SITE_VERIFICATION: ${NAVER_SITE_VERIFICATION:-}
        NEXT_PUBLIC_GA_ID: ${GA_ID:-}
    image: freelancer/frontend-next:${IMAGE_TAG:-latest}
    container_name: freelancer-next
    environment:
      TZ: Asia/Seoul
      # 🔴 빌드 ARG 로만 주면 안 된다 — 둘 다 필요하고 쓰이는 곳이 다르다.
      #    · 빌드 ARG : next.config.ts 의 rewrites destination (빌드 때 확정돼 이미지에 박힌다)
      #    · 런타임 env: lib/fetchers.ts·lib/api.ts·app/page.tsx 의 서버 분기
      #                 (NEXT_PUBLIC_ 접두사가 없는 변수는 서버가 요청마다 읽는다)
      #    빠뜨리면 SSR·sitemap 이 조용히 빈 값으로 폴백한다(에러도 안 난다).
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://freelancer-api:8081/api}
    ports:
      - "${FO_HOST_PORT:-8082}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks: [estsoft]

  # ---------------------------------------------------------------- BO (React SPA)
  # 정적 파일이라 기존과 같이 nginx 베이스 이미지 + 볼륨 마운트.
  # BO 는 API 를 절대 URL(https://job.estsw.co.kr/api)로 부르므로 프록시가 필요 없다.
  bo:
    image: nginx:stable-alpine
    container_name: freelancer-bo
    environment:
      TZ: Asia/Seoul
    volumes:
      - ../admin:/usr/share/nginx/html:ro
      - ./bo-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 게시글 이미지 등이 /uploads 로 참조되는 경우를 위해 기존과 동일하게 붙인다.
      - ${UPLOAD_DIR:-/DATA/freelancer_project/uploads}:/usr/share/nginx/html/uploads:ro
    ports:
      - "${BO_HOST_PORT:-8083}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [estsoft]

networks:
  # 서버에 이미 있는 네트워크. redis·mariadb·nginxproxymanager 가 전부 여기 있다.
  estsoft:
    external: true
